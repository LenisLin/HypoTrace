[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypotrace"
dynamic = ["version"]
description = "Benchmark protocol skeleton for bioinformatics agent evaluation."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[project.scripts]
hypotrace = "hypotrace.cli:main"

[tool.setuptools.packages.find]
include = ["hypotrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
